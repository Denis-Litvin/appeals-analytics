<form method="get" class="panel">
  <div class="filters">
    <div class="field">
      <label for="id_date_from">С</label>
      <input type="date" name="date_from" id="id_date_from" value="{{ start|date:'Y-m-d' }}">
    </div>
    <div class="field">
      <label for="id_date_to">По</label>
      <input type="date" name="date_to" id="id_date_to" value="{{ end|date:'Y-m-d' }}">
    </div>
    <div class="field">
      <label for="{{ form.category.id_for_label }}">{{ form.category.label }}</label>
      {{ form.category }}
    </div>
    <div class="field">
      <label for="{{ form.channel.id_for_label }}">{{ form.channel.label }}</label>
      {{ form.channel }}
    </div>
    <div class="buttons">
      <button type="submit" class="btn btn-primary">Показать</button>
      <a class="btn" href="{{ request.path }}">Сбросить</a>
    </div>
  </div>
  {% if form.errors %}
    <div class="notice notice-error" style="margin: .75rem 0 0">
      {% for field in form %}{% for error in field.errors %}{{ error }} {% endfor %}{% endfor %}
      Показан период по умолчанию.
    </div>
  {% endif %}
</form>
